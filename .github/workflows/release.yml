name: Release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
  SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}

jobs:
  gate:
    # A workflow_run can be privileged. Admit only this repository's main push;
    # the script also authenticates numeric repository/workflow/run identities.
    if: >-
      github.repository == 'PyModel/ci-optimiser' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout verified main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Require complete first-attempt main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 skills/ci-optimiser/scripts/run_budget.py --seconds 20 --label release-gate -- \
            python3 .github/release.py gate --sha "$SOURCE_SHA" --run-id "$SOURCE_RUN_ID"

  version:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
      actions: read
      pull-requests: write
      issues: write # Release Please's release-state labels.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Checkout verified release plumbing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Require current main and release candidates before mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 skills/ci-optimiser/scripts/run_budget.py --seconds 20 --label release-candidates -- \
            python3 .github/release.py prepare --sha "$SOURCE_SHA" --run-id "$SOURCE_RUN_ID"
      - name: Maintain release PR and draft release
        id: release
        timeout-minutes: 1
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Do not set release-type here: it bypasses manifest configuration.
      - name: Detect main movement during release mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$actual" = "$SOURCE_SHA"

  verify:
    needs: version
    if: needs.version.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag_name }}
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
    steps:
      - name: Checkout verified main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Verify standalone skill package
        run: |
          test "$RELEASE_SHA" = "$SOURCE_SHA"
          package_dir="$RUNNER_TEMP/release-skill/ci-optimiser"
          mkdir -p "$package_dir"
          git archive "$SOURCE_SHA:skills/ci-optimiser" | tar -x -C "$package_dir"
          cd "$package_dir"
          python scripts/run_budget.py --seconds 60 --label release-package-tests -- \
            python -m unittest discover -s tests -v
      - name: Verify exact source, version and complete CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 skills/ci-optimiser/scripts/run_budget.py --seconds 30 --label release-verification -- \
            python3 .github/release.py verify --sha "$SOURCE_SHA" --run-id "$SOURCE_RUN_ID" \
            --tag "$RELEASE_TAG" --release-sha "$RELEASE_SHA"

  publish:
    needs: [version, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag_name }}
      RELEASE_SHA: ${{ needs.version.outputs.sha }}
      RELEASE_ID: ${{ needs.version.outputs.release_id }}
    steps:
      # Only the already tested, trusted main commit supplies the small stdlib
      # publisher. No PR artifacts, package installation or package tests here.
      - name: Checkout verified release plumbing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Publish verified source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 skills/ci-optimiser/scripts/run_budget.py --seconds 30 --label release-publication -- \
            python3 .github/release.py publish --sha "$SOURCE_SHA" --run-id "$SOURCE_RUN_ID" \
            --tag "$RELEASE_TAG" --release-sha "$RELEASE_SHA" --release-id "$RELEASE_ID"
