name: CI timing audit

# Manual diagnostics only. This workflow is not a required CI or merge check.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    # Uses the existing GitHub cloud account; no runner-provider activation needed.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require default branch and first attempt
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$GITHUB_RUN_ATTEMPT" = 1
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Collect last 150 retained runs (all outcomes)
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: 1
        run: |
          python3 skills/ci-optimiser/scripts/run_budget.py --seconds 180 --label timing-collection -- \
            python3 skills/ci-optimiser/scripts/collect_gh.py \
            --repo "$GITHUB_REPOSITORY" --limit 150 --include-incomplete --timings-only \
            --timeout 10 --retries 0 --max-rate-wait 0 --out "$RUNNER_TEMP/ci-timing-raw"
      - name: Analyze diagnostic timings
        if: ${{ !cancelled() && steps.collect.outcome != 'skipped' }}
        run: |
          python3 skills/ci-optimiser/scripts/run_budget.py --seconds 10 --label timing-analysis -- \
            python3 skills/ci-optimiser/scripts/analyze_gh.py \
            --input "$RUNNER_TEMP/ci-timing-raw" --output "$RUNNER_TEMP/ci-timing-metrics.json"
      - name: Prepare safe report
        if: ${{ always() }}
        env:
          COLLECTION_STATUS: ${{ steps.collect.outcome }}
        run: |
          python3 skills/ci-optimiser/scripts/run_budget.py --seconds 5 --label timing-report -- \
            python3 skills/ci-optimiser/scripts/report_gh_timings.py \
            --metrics "$RUNNER_TEMP/ci-timing-metrics.json" --out "$RUNNER_TEMP/ci-timing-report" \
            --collection-status "$COLLECTION_STATUS"
      - name: Add report to run summary
        if: ${{ always() }}
        run: |
          python3 skills/ci-optimiser/scripts/run_budget.py --seconds 2 --label timing-summary -- \
            cat "$RUNNER_TEMP/ci-timing-report/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Save report and metrics
        if: ${{ always() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-timing-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-timing-report/report.md
            ${{ runner.temp }}/ci-timing-report/status.json
            ${{ runner.temp }}/ci-timing-report/metrics.json
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
          overwrite: false
