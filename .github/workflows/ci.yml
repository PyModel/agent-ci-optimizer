name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Blacksmith activation is a separate measured change; do not queue jobs on
    # unregistered labels. The full Python matrix runs on every candidate.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.x"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit + packaging tests
        working-directory: skills/ci-optimiser
        run: python scripts/run_budget.py --seconds 60 --label tests -- python ../../.github/run_repository_tests.py
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - name: Validate workflows
        run: python3 skills/ci-optimiser/scripts/run_budget.py --seconds 5 --label workflow-lint -- "$RUNNER_TEMP/actionlint" -color
  # Stable required check: every full-suite leg must succeed before admission.
  ci:
    if: always()
    needs: [test, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false
      - name: Require success
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.workflow-lint.result }}
          EXPECTED_API_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$CHECKOUT_OUTCOME" = success
          test "$TEST_RESULT" = success
          test "$LINT_RESULT" = success
          # This first work step can observe setup completion before the jobs
          # API catches up. Its timestamp conservatively includes work so far.
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          record = {
              "schema": "ci-current-job-setup/1",
              "job": os.environ["GITHUB_JOB"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "head_sha": os.environ["EXPECTED_API_HEAD_SHA"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "setup_end_step": "Checkout repository",
              "first_work_step": "Require success",
              "observed_at": datetime.now(timezone.utc).isoformat(),
          }
          with (Path(os.environ["RUNNER_TEMP"]) / "ci-current-setup.json").open("x") as stream:
              json.dump(record, stream)
          PY
      - name: Read job timing evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 skills/ci-optimiser/scripts/run_budget.py --seconds 10 --label timing-read -- \
            gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" \
            > "$RUNNER_TEMP/ci-jobs.json"
      - name: Enforce job budgets
        env:
          EXPECTED_API_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 skills/ci-optimiser/scripts/run_budget.py --seconds 5 --label budget-verifier -- \
            python3 skills/ci-optimiser/scripts/check_job_budgets.py \
            --jobs "$RUNNER_TEMP/ci-jobs.json" --policy .github/ci-budgets.json \
            --attempt "$GITHUB_RUN_ATTEMPT" --run-id "$GITHUB_RUN_ID" \
            --head-sha "$EXPECTED_API_HEAD_SHA" --current-job ci \
            --current-job-setup "$RUNNER_TEMP/ci-current-setup.json"
